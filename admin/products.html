<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products — CT Artisanal Pantry Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/logo/ct-monogram-v2.jpg">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../site.css">
<style>
  .img-upload-widget { display:flex; align-items:center; gap: var(--space-2); }
  .img-upload-widget img { width:48px; height:48px; object-fit:cover; border-radius:4px; border:1px solid var(--border); background:var(--surface-2); }
  .img-upload-widget .btn-upload { font-size:12px; padding:4px 8px; white-space:nowrap; }
  .img-path-input { font-size:12px; width:160px; }
  .product-row-expanded { display:none; background: var(--surface-2); }
  .product-row-expanded.open { display:table-row; }
  .product-row-expanded td { padding: var(--space-4); }
  .expanded-grid { display:grid; grid-template-columns:1fr 1fr; gap: var(--space-4); }
  @media(max-width:600px){ .expanded-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand">CT Admin</div>
    <nav>
      <a href="orders.html">Orders</a>
      <a href="products.html" class="active">Products</a>
      <a href="blog.html">Blog</a>
      <a href="content.html">Content</a>
    </nav>
    <div style="font-size:13px; color: var(--ink-300);">Logged in as <span data-admin-username>…</span></div>
    <button class="admin-logout" data-admin-logout>Log Out</button>
  </aside>

  <main class="admin-main">
    <h1 style="font: var(--text-h1); margin: 0 0 var(--space-6);">Products &amp; Inventory</h1>

    <div id="products-error" class="alert alert-error" style="display:none;"></div>
    <div id="products-success" class="alert alert-success" style="display:none;"></div>

    <table class="admin-table" style="margin-bottom: var(--space-8);">
      <thead>
        <tr>
          <th>Image</th>
          <th>Name</th>
          <th>Unit</th>
          <th>Price (PKR)</th>
          <th>Stock</th>
          <th>Active</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="products-body">
        <tr><td colspan="7" style="color: var(--text-muted);">Loading…</td></tr>
      </tbody>
    </table>

    <h2 style="font: var(--text-h2); margin: 0 0 var(--space-5);">Add a Product</h2>
    <form id="add-product-form" class="card" style="max-width:520px; display:flex; flex-direction:column; gap: var(--space-3);">
      <div class="form-field">
        <label for="new-name">Name</label>
        <input class="input" type="text" id="new-name" required>
      </div>
      <div class="form-field">
        <label for="new-unit">Unit label (e.g. "50 g")</label>
        <input class="input" type="text" id="new-unit">
      </div>
      <div class="form-field">
        <label for="new-slug">Slug (e.g. vanilla-beans)</label>
        <input class="input" type="text" id="new-slug">
      </div>
      <div class="form-field">
        <label for="new-description">Description</label>
        <textarea class="input" id="new-description" rows="2" style="resize:vertical;"></textarea>
      </div>
      <div class="form-field">
        <label>Product Image</label>
        <div class="img-upload-widget">
          <img id="new-image-preview" src="" alt="" style="display:none;">
          <input type="hidden" id="new-image-path">
          <button type="button" class="btn btn-outline btn-sm btn-upload" onclick="triggerUpload('new-file-input','new-image-preview','new-image-path')">Upload Image</button>
          <span id="new-upload-label" style="font-size:12px; color:var(--text-muted);">No image selected</span>
        </div>
        <input type="file" id="new-file-input" accept="image/*" style="display:none;">
      </div>
      <div style="display:flex; gap: var(--space-4);">
        <div class="form-field" style="flex:1;">
          <label for="new-price">Price (PKR)</label>
          <input class="input" type="number" id="new-price" min="0" required>
        </div>
        <div class="form-field" style="flex:1;">
          <label for="new-stock">Stock</label>
          <input class="input" type="number" id="new-stock" min="0" value="0" required>
        </div>
      </div>
      <button class="btn btn-primary" type="submit">Add Product</button>
    </form>
  </main>
</div>

<script src="../js/admin.js"></script>
<script>
  let products = [];

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }
  function showError(msg) {
    const el = document.getElementById('products-error');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('products-success').style.display = 'none';
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function showSuccess(msg) {
    const el = document.getElementById('products-success');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('products-error').style.display = 'none';
    setTimeout(() => { el.style.display = 'none'; }, 2500);
  }

  async function triggerUpload(fileInputId, previewId, pathInputId, labelId) {
    const fileInput = document.getElementById(fileInputId);
    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;
      const label = labelId ? document.getElementById(labelId) : null;
      if (label) label.textContent = 'Uploading…';
      try {
        const fd = new FormData();
        fd.append('file', file);
        const r = await fetch('/api/admin/upload', {
          method: 'POST',
          credentials: 'include',
          body: fd,
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Upload failed');
        const url = data.url;
        if (pathInputId) {
          const pathInput = document.getElementById(pathInputId);
          if (pathInput) pathInput.value = url;
        }
        const preview = document.getElementById(previewId);
        if (preview) { preview.src = url; preview.style.display = ''; }
        if (label) label.textContent = file.name;
      } catch (err) {
        if (label) label.textContent = 'Upload failed';
        showError('Image upload failed: ' + err.message);
      }
    };
    fileInput.click();
  }

  function renderProducts() {
    const body = document.getElementById('products-body');
    if (products.length === 0) {
      body.innerHTML = '<tr><td colspan="7" style="color: var(--text-muted);">No products yet.</td></tr>';
      return;
    }

    body.innerHTML = products.map((p) => {
      const imgSrc = p.image_path || '';
      const rowHtml = `
        <tr data-row="${p.id}">
          <td>
            <div class="img-upload-widget">
              <img id="img-prev-${p.id}" src="${escapeHtml(imgSrc)}" alt="" style="${imgSrc ? '' : 'display:none;'}">
              <div>
                <button type="button" class="btn btn-outline btn-sm btn-upload"
                  onclick="triggerUpload('file-inp-${p.id}','img-prev-${p.id}','img-path-${p.id}','img-lbl-${p.id}')">
                  Upload
                </button>
                <div id="img-lbl-${p.id}" style="font-size:11px;color:var(--text-muted);margin-top:2px;">${imgSrc ? '(current)' : 'No image'}</div>
              </div>
              <input type="file" id="file-inp-${p.id}" accept="image/*" style="display:none;">
              <input type="hidden" id="img-path-${p.id}" data-field="image_path" value="${escapeHtml(imgSrc)}">
            </div>
          </td>
          <td><input type="text" data-field="name" value="${escapeHtml(p.name)}"></td>
          <td><input type="text" data-field="unit_label" value="${escapeHtml(p.unit_label || '')}"></td>
          <td><input type="number" data-field="price_pkr" min="0" value="${p.price_pkr}"></td>
          <td><input type="number" data-field="stock_quantity" min="0" value="${p.stock_quantity}"></td>
          <td style="text-align:center;"><input type="checkbox" data-field="active" ${p.active ? 'checked' : ''}></td>
          <td style="white-space:nowrap;">
            <button type="button" class="btn btn-outline btn-sm" data-save="${p.id}">Save</button>
            <button type="button" class="btn btn-outline btn-sm" data-expand="${p.id}" style="margin-top:4px;">Details ▾</button>
          </td>
        </tr>
        <tr class="product-row-expanded" id="expanded-${p.id}">
          <td colspan="7">
            <div class="expanded-grid">
              <div class="form-field">
                <label>Description</label>
                <textarea class="input" data-field="description" rows="3" style="resize:vertical;">${escapeHtml(p.description || '')}</textarea>
              </div>
              <div class="form-field">
                <label>Slug</label>
                <input class="input" type="text" data-field="slug" value="${escapeHtml(p.slug || '')}">
              </div>
            </div>
          </td>
        </tr>
      `;
      return rowHtml;
    }).join('');

    body.querySelectorAll('[data-save]').forEach((btn) => {
      btn.addEventListener('click', () => saveProduct(Number(btn.dataset.save)));
    });

    body.querySelectorAll('[data-expand]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.expand;
        const row = document.getElementById('expanded-' + id);
        const isOpen = row.classList.contains('open');
        row.classList.toggle('open', !isOpen);
        btn.textContent = isOpen ? 'Details ▾' : 'Details ▴';
      });
    });
  }

  async function saveProduct(id) {
    const row = document.querySelector(`tr[data-row="${id}"]`);
    const expandedRow = document.getElementById('expanded-' + id);
    const payload = {
      name: row.querySelector('[data-field="name"]').value,
      unit_label: row.querySelector('[data-field="unit_label"]').value,
      price_pkr: Number(row.querySelector('[data-field="price_pkr"]').value),
      stock_quantity: Number(row.querySelector('[data-field="stock_quantity"]').value),
      active: row.querySelector('[data-field="active"]').checked,
      image_path: row.querySelector('[data-field="image_path"]').value,
    };
    if (expandedRow) {
      const desc = expandedRow.querySelector('[data-field="description"]');
      const slug = expandedRow.querySelector('[data-field="slug"]');
      if (desc) payload.description = desc.value;
      if (slug) payload.slug = slug.value;
    }
    try {
      const r = await fetch(`/api/admin/products?id=${id}`, {
        method: 'PUT',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        throw new Error(d.error || 'Failed to save');
      }
      showSuccess('Saved.');
    } catch (err) {
      showError('Failed to save product: ' + err.message);
    }
  }

  document.getElementById('add-product-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      name: document.getElementById('new-name').value,
      unit_label: document.getElementById('new-unit').value,
      slug: document.getElementById('new-slug').value,
      description: document.getElementById('new-description').value,
      image_path: document.getElementById('new-image-path').value,
      price_pkr: Number(document.getElementById('new-price').value),
      stock_quantity: Number(document.getElementById('new-stock').value),
    };
    try {
      const r = await fetch('/api/admin/products', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Failed to add product.');
      products.push(data.product);
      renderProducts();
      e.target.reset();
      document.getElementById('new-image-preview').style.display = 'none';
      document.getElementById('new-image-preview').src = '';
      document.getElementById('new-image-path').value = '';
      document.getElementById('new-upload-label').textContent = 'No image selected';
      showSuccess('Product added.');
    } catch (err) {
      showError(err.message);
    }
  });

  fetch('/api/admin/products', { credentials: 'include' })
    .then((r) => {
      if (!r.ok) throw new Error();
      return r.json();
    })
    .then((data) => {
      products = data.products || [];
      renderProducts();
    })
    .catch(() => showError('Failed to load products.'));
</script>

</body>
</html>
